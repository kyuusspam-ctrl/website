<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#34231d">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="A private shelf of shared moments.">
  <title>The Memory Bookshelf</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/room.css">
  <link rel="stylesheet" href="styles/book.css">
  <link rel="stylesheet" href="styles/editor.css">
  <link rel="stylesheet" href="styles/ambience.css">
</head>
<body>
  <main id="app" aria-live="polite">
    <section id="room" class="room" aria-label="The reading room">
      <div class="decor" aria-hidden="true"><span class="d-wall"></span><span class="d-photo"></span><span class="d-wainscot"></span><span class="d-floor"></span><span class="d-rug"></span><span class="d-vignette"></span><span class="d-night"></span></div>

 class="halo t2" style="animation-delay:-3.11s" cx="834.0" cy="48.6" r="15" fill="url(#fgl)"/><circle class="core" cx="834.0" cy="48.6" r="3.2" fill="#ffd08a"/></g><g><circle class="halo t0" style="animation-delay:-2.34s" cx="872.0" cy="53.4" r="15" fill="url(#fgl)"/><circle class="core" cx="872.0" cy="53.4" r="3.2" fill="#ffd08a"/></g><g><circle class="halo t1" style="animation-delay:-1.45s" cx="910.0" cy="55.0" r="15" fill="url(#fgl)"/><circle class="core" cx="910.0" cy="55.0" r="3.2" fill="#ffd08a"/></g><g><circle class="halo t2" style="animation-delay:-3.18s" cx="948.0" cy="53.4" r="15" fill="url(#fgl)"/><circle class="core" cx="948.0" cy="53.4" r="3.2" fill="#ffc477"/></g><g><circle class="halo t0" style="animation-delay:-0.33s" cx="986.0" cy="48.6" r="15" fill="url(#fgl)"/><circle class="core" cx="986.0" cy="48.6" r="3.2" fill="#ffc477"/></g><g><circle class="halo t1" style="animation-delay:-2.1s" cx="1024.0" cy="40.6" r="15" fill="url(#fgl)"/><circle class="core" cx="1024.0" cy="40.6" r="3.2" fill="#ffe6bd"/></g><g><circle class="halo t2" style="animation-delay:-2.92s" cx="1062.0" cy="29.4" r="15" fill="url(#fgl)"/><circle class="core" cx="1062.0" cy="29.4" r="3.2" fill="#ffe6bd"/></g><g><circle class="halo t0" style="animation-delay:-2.44s" cx="1138.0" cy="29.4" r="15" fill="url(#fgl)"/><circle class="core" cx="1138.0" cy="29.4" r="3.2" fill="#ffe6bd"/></g><g><circle class="halo t1" style="animation-delay:-0.47s" cx="1176.0" cy="40.6" r="15" fill="url(#fgl)"/><circle class="core" cx="1176.0" cy="40.6" r="3.2" fill="#ffd9a0"/></g><g><circle class="halo t2" style="animation-delay:-0.66s" cx="1214.0" cy="48.6" r="15" fill="url(#fgl)"/><circle class="core" cx="1214.0" cy="48.6" r="3.2" fill="#ffd08a"/></g><g><circle class="halo t0" style="animation-delay:-0.61s" cx="1252.0" cy="53.4" r="15" fill="url(#fgl)"/><circle class="core" cx="1252.0" cy="53.4" r="3.2" fill="#ffe6bd"/></g><g><circle class="halo t1" style="animation-delay:-1.69s" cx="1290.0" cy="55.0" r="15" fill="url(#fgl)"/><circle class="core" cx="1290.0" cy="55.0" r="3.2" fill="#ffd08a"/></g><g><circle class="halo t2" style="animation-delay:-3.06s" cx="1328.0" cy="53.4" r="15" fill="url(#fgl)"/><circle class="core" cx="1328.0" cy="53.4" r="3.2" fill="#ffd9a0"/></g><g><circle class="halo t0" style="animation-delay:-1.36s" cx="1366.0" cy="48.6" r="15" fill="url(#fgl)"/><circle class="core" cx="1366.0" cy="48.6" r="3.2" fill="#ffe6bd"/></g><g><circle class="halo t1" style="animation-delay:-2.38s" cx="1404.0" cy="40.6" r="15" fill="url(#fgl)"/><circle class="core" cx="1404.0" cy="40.6" r="3.2" fill="#ffe6bd"/></g><g><circle class="halo t2" style="animation-delay:-0.28s" cx="1442.0" cy="29.4" r="15" fill="url(#fgl)"/><circle class="core" cx="1442.0" cy="29.4" r="3.2" fill="#ffd08a"/></g></svg>
      <div class="window-set" aria-hidden="true"><span class="curtain-rod"></span><span class="curtain curtain-l"></span><span class="curtain curtain-r"></span><div class="window"><span class="window-glow"></span><span class="rain"></span><span class="window-cross"></span></div><span class="sill"></span><span class="beam"></span></div>
      <div class="dust" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <header class="room-header">
        <a class="wordmark" href="#room" aria-label="The Memory Bookshelf home"><span class="wordmark-mark">✳</span><span>The Memory<br>Bookshelf</span></a>
        <div class="room-actions">
          <button id="atmosphere-toggle" class="quiet-button" aria-pressed="false" title="Pause room atmosphere">Atmosphere <span>Ⅱ</span></button>
          <button id="sound-toggle" class="quiet-button" aria-pressed="false" title="Turn on quiet rain">Sound <span>♪</span></button>
          <button id="view-toggle" class="quiet-button" aria-label="Change shelf view">Shelf view <span>⌄</span></button>
          <button id="lock-room" class="quiet-button" title="Lock the room">Lock room <span>⌑</span></button>
        </div>
      </header>
      <div class="room-copy"><p class="eyebrow">A little place for us</p><h1>Some things deserve<br><em>a shelf of their own.</em></h1><p class="room-intro">Choose a book. Take your time.</p>
        <section class="character-picker" aria-label="Select a character"><p class="character-prompt">Who are you today?</p><div class="character-options" role="group" aria-label="Choose froggiee or kyuu">
          <button class="character-choice" type="button" data-character="froggiee" aria-pressed="false"><img class="character-avatar" src="./assets/froggie-avatar.svg" alt="" onerror="this.remove();" /><span>froggiee</span></button>
          <button class="character-choice" type="button" data-character="kyuu" aria-pressed="false"><img class="character-avatar" src="./assets/kyuu-avatar.svg" alt="" onerror="this.remove();" /><span>kyuu</span></button>
        </div><p id="character-status" class="character-status" aria-live="polite">Pick a character to make this shelf yours.</p></section>
      </div>
      <section class="shelf-scene" aria-label="Memory books">
        <div class="shelf-caption"><span>OUR LITTLE LIBRARY</span><span id="book-count"></span></div>
        <div id="book-shelf" class="book-shelf"></div>
        <div class="shelf-board"></div><div class="shelf-shadow"></div>
        <div class="shelf-top" aria-hidden="true"><svg class="prop stack" viewBox="0 0 150 76" width="150" height="76" focusable="false"><rect x="6" y="52" width="138" height="22" rx="2.5" fill="#6d3f35"/><rect x="6" y="52" width="138" height="5" rx="2" fill="#8e5a49"/><rect x="12" y="60" width="126" height="2" fill="#d9b673" opacity=".55"/><rect x="12" y="66" width="126" height="1.5" fill="#d9b673" opacity=".35"/><rect x="16" y="32" width="120" height="20" rx="2.5" fill="#3f5d56"/><rect x="16" y="32" width="120" height="5" rx="2" fill="#5f8077"/><rect x="24" y="41" width="104" height="2" fill="#d9b673" opacity=".5"/><rect x="10" y="14" width="128" height="18" rx="2.5" fill="#8a6a3c"/><rect x="10" y="14" width="128" height="4.5" rx="2" fill="#b08c55"/><rect x="18" y="22" width="112" height="2" fill="#f2e1bd" opacity=".5"/></svg><svg class="prop sprig" viewBox="0 0 80 112" width="80" height="112" focusable="false"><g fill="#2f5b44"><path d="M40 78C30 56 28 34 36 10c8 22 10 44 4 68z"/><path d="M40 78C48 54 58 40 70 28c-2 24-12 40-30 50z" fill="#3b7054"/><path d="M40 78C32 60 20 52 8 50c4 16 14 26 32 28z" fill="#356548"/><path d="M40 78C42 56 46 38 54 22c4 20 0 40-14 56z" fill="#285039"/></g><path d="M18 76h44l-5 32c-.5 3-3 4-6 4H29c-3 0-5.500-1-6-4z" fill="#b5694a"/><rect x="15" y="72" width="50" height="9" rx="3" fill="#c97a57"/><rect x="15" y="72" width="50" height="3" rx="1.500" fill="#e09a74" opacity=".6"/></svg><svg class="prop candle" viewBox="0 0 70 100" width="70" height="100" focusable="false"><defs><radialGradient id="cgl"><stop offset="0" stop-color="#ffd596" stop-opacity=".9"/><stop offset=".4" stop-color="#ffbe6a" stop-opacity=".35"/><stop offset="1" stop-color="#ffbe6a" stop-opacity="0"/></radialGradient></defs><circle class="cglow" cx="35" cy="44" r="34" fill="url(#cgl)"/><rect x="16" y="46" width="38" height="50" rx="7" fill="#262322" stroke="#d9b673" stroke-opacity=".28"/><rect x="19" y="56" width="32" height="37" rx="4" fill="#e8dcc2"/><rect x="19" y="56" width="32" height="6" rx="3" fill="#fff6e0" opacity=".7"/><rect x="34" y="42" width="2" height="15" fill="#3a2a20"/><g transform="translate(0 9)"><path class="flame" d="M35 14c-5 8-6 15-2 21 1.500 2.200 2.500 2.200 4 0 4-6 3-13-2-21z" fill="#ffc86b"/><path class="flame" d="M35 25c-2 4-2 7 0 10 2-3 2-6 0-10z" fill="#fff3d0"/></g></svg></div>
        <div class="room-lamp" role="button" tabindex="0" aria-pressed="true" aria-label="Reading lamp" title="Switch lamp off"><span class="lamp-shade"></span><span class="lamp-base"></span><span class="lamp-light"></span></div>
        <div class="floor-plant-wrap" aria-hidden="true"><svg class="floor-plant" viewBox="0 0 130 250" width="130" height="250" focusable="false"><g stroke="#244a39" stroke-width="3" fill="none"><path d="M65 150C60 110 48 80 30 52"/><path d="M65 150C68 100 74 62 98 30"/><path d="M65 150C64 120 62 84 66 22"/></g><g><ellipse cx="26" cy="46" rx="20" ry="30" transform="rotate(-38 26 46)" fill="#2f6a4d"/><ellipse cx="102" cy="26" rx="19" ry="30" transform="rotate(34 102 26)" fill="#3a7a58"/><ellipse cx="66" cy="22" rx="17" ry="28" fill="#2a5c43"/><ellipse cx="30" cy="92" rx="16" ry="25" transform="rotate(-62 30 92)" fill="#285a42"/><ellipse cx="104" cy="82" rx="16" ry="25" transform="rotate(60 104 82)" fill="#33704f"/><ellipse cx="44" cy="122" rx="13" ry="21" transform="rotate(-52 44 122)" fill="#356f50"/><ellipse cx="88" cy="118" rx="13" ry="21" transform="rotate(50 88 118)" fill="#2c6247"/></g><path d="M30 148h70l-9 88c-.5 6-4 10-10 10H49c-6 0-9.500-4-10-10z" fill="#8c5a3e"/><rect x="26" y="142" width="78" height="14" rx="5" fill="#a56c4a"/><rect x="26" y="142" width="78" height="4" rx="2" fill="#c78d66" opacity=".55"/></svg></div>
      </section>
      <footer class="room-footer"><button class="keyhole" id="writer-entry" aria-label="Open writer mode as the selected character">✳</button><span>Made of days we kept</span><button class="reader-help" id="about-button">About this shelf</button></footer>
      <div class="view-popover" id="view-popover" hidden><button data-view="shelf">Bookshelf</button><button data-view="timeline">Timeline</button><button data-view="constellation">Constellation</button><button data-view="map">Map <small>(loads only when opened)</small></button></div>
      <div id="view-panel" class="view-panel" hidden></div>
    </section>
    <section id="reader" class="reader" hidden aria-label="Open memory book">
      <button id="close-book" class="close-book" aria-label="Close book">↩ <span>Back to shelf</span></button>
      <div class="reader-heading"><span id="reader-book-title"></span><span id="page-indicator"></span></div>
      <div class="book-stage" id="book-stage" tabindex="0" aria-label="Book pages. Use left and right arrows to turn pages.">
        <div class="open-book" id="open-book"></div>
      </div>
      <div class="reader-controls"><button id="prev-page" aria-label="Previous spread">←</button><span>turn the page</span><button id="next-page" aria-label="Next spread">→</button></div>
    </section>
  </main>
  <dialog id="dialog" class="paper-dialog"><form method="dialog"><button class="dialog-close" aria-label="Close">×</button></form><div id="dialog-content"></div></dialog>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/ambience.js"></script>
</body>
</html>
